# Publish the standalone site; no Sphinx or Doxygen build is involved.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  apt_packages:
    - graphviz
  jobs:
    install:
      - python -m pip install -r docs/requirements-api.txt
    build:
      html:
        - python docs/build_docs.py --output docs/_build/flint-api
        - mkdir -p "$READTHEDOCS_OUTPUT/html"
        - cp -a docs/_build/flint-api/html/. "$READTHEDOCS_OUTPUT/html/"
